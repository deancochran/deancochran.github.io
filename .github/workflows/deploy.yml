name: CI & Deploy to GitHub Pages

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # 1️⃣ Checkout repository
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2️⃣ Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Test Buffer distribution script
              run: node --test scripts/buffer-distribute.test.mjs

            # 3️⃣ Setup pnpm
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.3.0

            # 4️⃣ Install dependencies
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check project
              run: pnpm check

            - name: Check formatting
              run: pnpm format:check

            # 5️⃣ Build project
            - name: Build project
              run: pnpm build

            # 6️⃣ Upload production-ready build files
            - name: Upload build files
              uses: actions/upload-pages-artifact@v3
              with:
                  path: build # Ensure your adapter-static outputs here

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    # Required: BUFFER_API_KEY secret, plus BUFFER_ORGANIZATION_ID and
    # comma-separated BUFFER_CHANNEL_IDS repository variables.
    distribute:
        runs-on: ubuntu-latest
        needs: deploy
        steps:
            - name: Checkout deployed revision with history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Distribute newly public posts through Buffer
              env:
                  BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
                  BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
                  BUFFER_CHANNEL_IDS: ${{ vars.BUFFER_CHANNEL_IDS }}
                  SITE_ORIGIN: https://deancochran.github.io
              run: >-
                  node scripts/buffer-distribute.mjs
                  --before "${{ github.event.before }}"
                  --after "${{ github.sha }}"
