<svg
    xmlns="http://www.w3.org/2000/svg"
    width="480"
    height="990"
    viewBox="0 0 480 990"
    role="img"
    aria-labelledby="title desc"
>
    <title id="title">What the FTMS package does</title>
    <desc id="desc">
        The diagram has two flows. To read machine data, a fitness machine sends
        data to the application's Bluetooth connection, which passes it to the
        FTMS package for reading into data and warnings. To send a command, the
        application asks the FTMS package to build command bytes, then sends them
        through its own Bluetooth connection to the fitness machine. The FTMS
        package does not connect to the machine.
    </desc>
    <defs>
        <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto"
        >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    <rect width="480" height="990" rx="24" fill="#f8fafc" />
    <text
        x="240"
        y="58"
        fill="#0f172a"
        font-family="system-ui, sans-serif"
        font-size="30"
        font-weight="700"
        text-anchor="middle"
    >
        What the FTMS package does
    </text>

    <g font-family="system-ui, sans-serif" text-anchor="middle">
        <text x="24" y="122" fill="#0f172a" font-size="27" font-weight="700" text-anchor="start">
            Reading machine data
        </text>
        <text x="24" y="153" fill="#475569" font-size="22" text-anchor="start">
            Your app receives Bluetooth data.
        </text>

        <rect x="24" y="180" width="205" height="132" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2" />
        <text x="126.5" y="225" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="126.5">Fitness</tspan>
            <tspan x="126.5" dy="28">machine</tspan>
        </text>
        <text x="126.5" y="282" fill="#475569" font-size="22">sends data</text>

        <rect x="251" y="180" width="205" height="132" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2" />
        <text x="353.5" y="220" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="353.5">Your</tspan>
            <tspan x="353.5" dy="28">application</tspan>
        </text>
        <text x="353.5" y="276" fill="#475569" font-size="22">
            <tspan x="353.5">Bluetooth</tspan>
            <tspan x="353.5" dy="25">connection</tspan>
        </text>

        <rect x="251" y="360" width="205" height="132" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
        <text x="353.5" y="412" fill="#0f172a" font-size="24" font-weight="700">FTMS package</text>
        <text x="353.5" y="452" fill="#475569" font-size="22">reads the data</text>

        <rect x="24" y="360" width="205" height="132" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="126.5" y="405" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="126.5">Data +</tspan>
            <tspan x="126.5" dy="28">warnings</tspan>
        </text>
        <text x="126.5" y="462" fill="#475569" font-size="22">useful values</text>

        <path d="M 24 534 H 456" fill="none" stroke="#cbd5e1" stroke-width="2" />

        <text x="24" y="588" fill="#0f172a" font-size="27" font-weight="700" text-anchor="start">
            Sending a command
        </text>
        <text x="24" y="619" fill="#475569" font-size="22" text-anchor="start">
            Your app decides when to send it.
        </text>

        <rect x="24" y="648" width="205" height="132" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="126.5" y="688" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="126.5">Your</tspan>
            <tspan x="126.5" dy="28">application</tspan>
        </text>
        <text x="126.5" y="738" fill="#475569" font-size="22">
            <tspan x="126.5">chooses a</tspan>
            <tspan x="126.5" dy="25">command</tspan>
        </text>

        <rect x="251" y="648" width="205" height="132" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
        <text x="353.5" y="700" fill="#0f172a" font-size="24" font-weight="700">FTMS package</text>
        <text x="353.5" y="740" fill="#475569" font-size="22">
            <tspan x="353.5">builds command</tspan>
            <tspan x="353.5" dy="25">bytes</tspan>
        </text>

        <rect x="251" y="828" width="205" height="132" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2" />
        <text x="353.5" y="868" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="353.5">Your</tspan>
            <tspan x="353.5" dy="28">application</tspan>
        </text>
        <text x="353.5" y="924" fill="#475569" font-size="22">
            <tspan x="353.5">sends with</tspan>
            <tspan x="353.5" dy="25">Bluetooth</tspan>
        </text>

        <rect x="24" y="828" width="205" height="132" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2" />
        <text x="126.5" y="873" fill="#0f172a" font-size="24" font-weight="700">
            <tspan x="126.5">Fitness</tspan>
            <tspan x="126.5" dy="28">machine</tspan>
        </text>
        <text x="126.5" y="928" fill="#475569" font-size="22">
            <tspan x="126.5">receives</tspan>
            <tspan x="126.5" dy="25">command</tspan>
        </text>
    </g>

    <g fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)">
        <path d="M 229 246 H 239" />
        <path d="M 353.5 312 V 344" />
        <path d="M 251 426 H 245" />
        <path d="M 229 714 H 239" />
        <path d="M 353.5 780 V 812" />
        <path d="M 251 894 H 245" />
    </g>
</svg>
